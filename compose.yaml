services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello_local_only
      POSTGRES_DB: hello
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hello_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello -d hello"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hello_postgres:
